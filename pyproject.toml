[project]
name = "sfactory"
version = "0.1.0"
description = "WF-native strategy discovery and validation platform"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "polars>=1.0", "numba>=0.60", "duckdb>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sfactory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
